<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>詭地圖｜消失在工區下的市場</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="brand">詭地圖<span style="color:var(--red)">．</span></div><div class="badge">EP.01 移位之地</div></div><div class="meta mono">CASE STATUS<br>INVESTIGATING</div></header><span class="badge">CASE 02 // 今昔航照</span><h1>消失在工區下的市場</h1><p>現代圖上是一片工區。切換1945與現在，利用道路與街廓找出同一塊地。</p><div class="viewer" id="v"><img src="past1945.png"><img src="modern.png" id="now" style="opacity:.5"></div><div class="control"><div class="small mono">1945 ◀ 圖層透光度 ▶ 現代</div><input id="s" type="range" min="0" max="100" value="50"><button id="fl" style="width:100%;margin-top:8px">閃爍比對 FLICKER</button></div><div class="panel"><p>官方位置錨點：舊永和市場原址與 G08 工程街廓相關。不要靠「建築看起來像」判定；先比道路骨架。</p><button class="primary" onclick="mark('g08','archive.html')">我找到同一塊街廓 →</button></div><script>s.oninput=()=>now.style.opacity=s.value/100;let t;fl.onclick=()=>{if(t){clearInterval(t);t=null;now.style.opacity=s.value/100;fl.textContent='閃爍比對 FLICKER'}else{let x=0;t=setInterval(()=>now.style.opacity=(x^=1),360);fl.textContent='停止閃爍'}}</script><footer class="mono">GHOST MAP / EP.01 · 真實史料與虛構敘事分層呈現</footer></main><script src="app.js"></script></body></html>
