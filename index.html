<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>詭地圖｜為什麼叫「新」永和市場？</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="brand">詭地圖<span style="color:var(--red)">．</span></div><div class="badge">EP.01 移位之地</div></div><div class="meta mono">CASE STATUS<br>INVESTIGATING</div></header><span class="badge">CASE 00 // 青溪</span><h1>為什麼叫「新」永和市場？</h1><p>你現在站在青溪國小附近。眼前是一座叫做「新永和市場」的市場。</p><div class="viewer"><img src="map1920.png" id="m"><div id="cover" style="position:absolute;inset:0;background:rgba(8,10,14,.72);display:grid;place-items:center;text-align:center;padding:25px"><b>現代座標：青溪國小／新永和市場<br><span style="color:var(--gold)">把年代往回拉。</span></b></div></div><div class="control"><div class="small mono" id="year">2026 → 1920</div><input id="s" type="range" min="0" max="100" value="0"></div><div class="panel"><p id="f">這張圖先不要急著解讀。只記住：百年前，這裡不是今天的城市。</p><button id="go" class="primary" disabled>追查「新」從哪裡來 →</button></div><script>const s=document.querySelector('#s'),c=document.querySelector('#cover'),g=document.querySelector('#go');s.oninput=()=>{c.style.opacity=1-s.value/100;if(s.value>25)g.disabled=false};g.onclick=()=>mark('qingxi','move.html')</script><footer class="mono">GHOST MAP / EP.01 · 真實史料與虛構敘事分層呈現</footer></main><script src="app.js"></script></body></html>
